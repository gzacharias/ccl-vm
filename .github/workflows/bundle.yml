# Reusable workflow, called by vm-test.yml and vm-extended.yml: builds bc-compiler natively,
# starting from the ccl 1.14 binaries, and compiles the bc bundle.  Uploads the artifacts
# ccl-bc (the bundle), ccl-native (the native build, for running ccl-tests) and bundle-logs.
# The steps' scripts are in .github/ci/.
name: Build bundle

on:
  workflow_call:
    inputs:
      ccl_ref:
        description: "gzacharias/ccl branch, tag or commit to build"
        type: string
        required: true

jobs:
  bundle:
    runs-on: macos-15-intel
    steps:
      - name: Check out bc-compiler
        uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl
          ref: ${{ inputs.ccl_ref }}
          path: ccl

      # The scripts come from this repository.
      - name: Check out ccl-vm
        uses: actions/checkout@v7
        with:
          path: ccl-vm

      - name: Install 1.14 bootstrapping binaries
        run: ccl-vm/.github/ci/install-bootstrap.sh

      - name: First rebuild (stock 1.14 kernel)
        run: ccl-vm/.github/ci/native-rebuild.sh 1

      - name: Second rebuild (should be warning-free)
        run: ccl-vm/.github/ci/native-rebuild.sh 2 --fail-on-warnings

      - name: Compile the bc bundle
        run: ccl-vm/.github/ci/bc-compile.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ccl-bc
          path: ccl-bc.tar.gz

      - name: Save the native build for ccl-tests
        run: tar -czf ccl-native.tar.gz --exclude .git --exclude ccl-bc ccl

      - uses: actions/upload-artifact@v7
        with:
          name: ccl-native
          path: ccl-native.tar.gz

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bundle-logs
          path: "*.log"
