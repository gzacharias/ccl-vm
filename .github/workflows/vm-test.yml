# The quick check (about 30 minutes): builds bc-compiler natively and compiles the bc bundle
# (bundle.yml), then in parallel runs ccl-tests on the native build and tests the bundle in
# ccl-vm on an Intel mac: boots it on sbcl and on ccl 1.14, and on sbcl rebuilds ccl in the VM
# and cross-compiles a native ccl from it.  The longer tests are in vm-extended.yml.
# A push to the ci branch tests gzacharias/ccl's ci branch and runs every step.
# (Run workflow only shows up once this file is on the default branch.)
# The steps' scripts are in .github/ci/.
name: Build bundle and test VM

on:
  workflow_dispatch:
    inputs:
      ccl_ref:
        description: "gzacharias/ccl branch, tag or commit to build"
        default: bc-compiler
      vm_rebuild:
        description: "Also run (rebuild-ccl :clean t) inside the VM"
        type: boolean
        default: false
      cross_compile:
        description: "Also cross-compile darwinx8664 from the VM and boot the result"
        type: boolean
        default: false
  push:
    branches: [ci]

permissions:
  contents: read

env:
  CCL_REF: ${{ inputs.ccl_ref || 'ci' }}

jobs:
  bundle:
    uses: ./.github/workflows/bundle.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}

  # Runs alongside the vm job, so the VM tests don't wait for ccl-tests.
  ccl-tests:
    needs: bundle
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ccl-native

      - name: Unpack the native build
        run: tar -xzf ccl-native.tar.gz

      - name: Check out ccl-tests
        uses: actions/checkout@v4
        with:
          repository: Clozure/ccl-tests
          path: ccl-tests

      - name: Run ccl-tests on the native build
        working-directory: ccl-tests
        run: make CCL=../ccl/dx86cl64

  vm:
    needs: bundle
    runs-on: macos-15-intel
    steps:
      - name: Check out ccl-vm
        uses: actions/checkout@v4
        with:
          path: ccl-vm

      - name: Check out ccl sources (for rebuild and cross-compile)
        if: ${{ github.event_name == 'push' || inputs.vm_rebuild || inputs.cross_compile }}
        uses: actions/checkout@v4
        with:
          repository: gzacharias/ccl
          ref: ${{ env.CCL_REF }}
          path: ccl
          fetch-depth: 0               # full history and tags, so `git describe` works for the version string

      - uses: actions/download-artifact@v4
        with:
          name: ccl-bc

      - name: Install sbcl, ccl 1.14 and Quicklisp
        run: ccl-vm/.github/ci/install-hosts.sh sbcl ccl

      - name: Boot the bundle in the VM (sbcl host)
        run: ccl-vm/.github/ci/vm-smoke.sh sbcl

      - name: Boot the bundle in the VM (ccl host)
        if: ${{ !cancelled() }}
        run: ccl-vm/.github/ci/vm-smoke.sh ccl

      - name: rebuild-ccl inside the VM
        if: ${{ github.event_name == 'push' || inputs.vm_rebuild }}
        run: ccl-vm/.github/ci/vm-rebuild.sh sbcl ccl-bc vm-rebuild

      - name: Cross-compile darwinx8664 from the VM
        if: ${{ github.event_name == 'push' || inputs.cross_compile }}
        run: ccl-vm/.github/ci/vm-cross-compile.sh sbcl

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vm-logs
          path: "*.log"
