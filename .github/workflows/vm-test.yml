# The quick check: builds bc-compiler natively and compiles the native bc bundles (bundle.yml),
# makes the canonical bundles from them, generations 1 and 2 on sbcl (gen2.yml), then in parallel
# runs ccl-tests on the native build (failing only on tests that pass on upstream-base,
# ccl-tests-baseline.yml) and tests generation 2 in ccl-vm on an Intel mac: boots it on
# sbcl and on ccl 1.14, and on sbcl cross-compiles a native ccl from a clean upstream ccl
# (upstream-base, the upstream commit bc-compiler was last merged with).  The longer tests are in
# vm-extended.yml.
# A push to the ci branch tests gzacharias/ccl's ci branch and runs every step; so does a push
# to gzacharias/ccl's bc-compiler, whose bc-compiler.yml calls this workflow.  The release-bundle
# job reports (as a warning, not a failure) whether each generation 2 matches the latest release's
# bundle (dccl-bc.tar.gz, lccl-bc.tar.gz).
# (Run workflow only shows up once this file is on the default branch.)
# The steps' scripts are in .github/ci/.
name: Build bundle and test VM

on:
  workflow_dispatch:
    inputs:
      ccl_ref:
        description: "gzacharias/ccl branch, tag or commit to build"
        default: bc-compiler
      cross_compile:
        description: "Also cross-compile darwinx8664 from the VM and boot the result"
        type: boolean
        default: false
  push:
    branches: [ci]
  workflow_call:
    inputs:
      ccl_ref:
        description: "gzacharias/ccl commit to build"
        type: string
        required: true
      ccl_vm_ref:
        description: "ccl-vm commit for the scripts (the caller is in another repository)"
        type: string
        required: true

permissions:
  contents: read

env:
  CCL_REF: ${{ inputs.ccl_ref || 'ci' }}
  # The scripts' commit: github.sha is the caller's when called from gzacharias/ccl.
  CCL_VM_REF: ${{ inputs.ccl_vm_ref || github.sha }}

jobs:
  bundle:
    uses: ./.github/workflows/bundle.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      ccl_vm_ref: ${{ inputs.ccl_vm_ref || github.sha }}

  gen2:
    needs: bundle
    uses: ./.github/workflows/gen2.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      ccl_vm_ref: ${{ inputs.ccl_vm_ref || github.sha }}

  # Are the generation 2 bundles byte-identical to the ones in the latest ccl-vm release?
  release-bundle:
    needs: gen2
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out ccl-vm
        uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl-vm
          ref: ${{ env.CCL_VM_REF }}
          path: ccl-vm

      - uses: actions/download-artifact@v8
        with:
          pattern: "?ccl-bc-gen2"

      - name: Compare with the latest release's bundles
        shell: bash   # pipefail: a harness failure in compare-bundles.sh still fails the step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R gzacharias/ccl-vm --json tagName --jq .tagName)
          echo "### Bundles vs release $tag" >> "$GITHUB_STEP_SUMMARY"
          for b in dccl-bc lccl-bc; do
            mkdir -p release
            if ! gh release download "$tag" -R gzacharias/ccl-vm -p $b.tar.gz -D release; then
              msg="The $tag release has no $b.tar.gz: upload this run's $b-gen2 artifact as its asset."
              echo "::warning::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            rm -f bundle-diff.txt
            COMPARE_LEVEL=warning ccl-vm/.github/ci/compare-bundles.sh \
              "release $tag=release/$b.tar.gz" "generation 2=$b-gen2/$b.tar.gz" | tee compare-$b.txt
            if [ -f bundle-diff.txt ]; then
              mv bundle-diff.txt bundle-diff-$b.txt
              msg="The $tag release asset $b.tar.gz does not match this bc-compiler: if this is what users get from GitHub, replace the asset with this run's $b-gen2 artifact."
              echo "::warning::$msg"
            else
              msg="The $tag release asset $b.tar.gz matches this bc-compiler."
            fi
            { echo "$msg"; echo '```'; grep -v '^[<>]' compare-$b.txt | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Keep the differences
        if: ${{ hashFiles('bundle-diff-*.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-diff
          path: bundle-diff-*.txt

  baseline:
    uses: ./.github/workflows/ccl-tests-baseline.yml
    with:
      labels: '["intel"]'
      ccl_vm_ref: ${{ inputs.ccl_vm_ref || github.sha }}

  # Runs alongside the vm job, so the VM tests don't wait for ccl-tests.
  ccl-tests:
    needs: [bundle, baseline]
    runs-on: macos-15-intel
    env:
      CCL_TESTS_REF: ${{ needs.baseline.outputs.ccl_tests_ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ccl-native
      - uses: actions/download-artifact@v8
        with:
          name: ccl-tests-baseline-intel
          path: ccl-tests-baseline

      - name: Unpack the native build
        run: tar -xzf ccl-native.tar.gz

      - name: Check out ccl-vm
        uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl-vm
          ref: ${{ env.CCL_VM_REF }}
          path: ccl-vm

      - name: Run ccl-tests on the native build, against upstream-base's
        run: ccl-vm/.github/ci/ccl-tests.sh ccl/dx86cl64 ccl-tests-baseline/ccl-tests-failures.txt

      - name: Keep the log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ccl-tests-log
          path: |
            ccl-tests.log
            ccl-tests-failures.txt

  vm:
    needs: gen2
    if: ${{ !cancelled() }}
    runs-on: macos-15-intel
    steps:
      - name: Check out ccl-vm
        uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl-vm
          ref: ${{ env.CCL_VM_REF }}
          path: ccl-vm

      - name: Check out upstream-base (to cross-compile)
        if: ${{ github.event_name == 'push' || inputs.cross_compile }}
        uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl
          ref: upstream-base
          path: ccl
          fetch-depth: 0               # full history and tags, so `git describe` works for the version string

      - uses: actions/download-artifact@v8
        with:
          name: ccl-bc-gen2

      - name: Install sbcl, ccl 1.14 and Quicklisp
        run: ccl-vm/.github/ci/install-hosts.sh sbcl ccl

      - name: Boot the bundle in the VM (sbcl host)
        run: ccl-vm/.github/ci/vm-smoke.sh sbcl

      - name: Boot the bundle in the VM (ccl host)
        if: ${{ !cancelled() }}
        run: ccl-vm/.github/ci/vm-smoke.sh ccl

      - name: Cross-compile darwinx8664 from the VM
        if: ${{ github.event_name == 'push' || inputs.cross_compile }}
        run: ccl-vm/.github/ci/vm-cross-compile.sh sbcl

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vm-logs
          path: "*.log"
