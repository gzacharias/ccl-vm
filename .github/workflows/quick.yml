# The quick check for a push: native builds, ccl-tests and bundles on the two macs (native.yml),
# then the canonical bundle, generations 1 and 2 on sbcl on the Intel mac (gen2.yml), then the VM
# on sbcl and ccl on both macs on generation 2: boot and regression tests (vm.yml, without the
# cross-host comparison).  The full suite is nightly.yml.
# A push to the ci-quick branch tests gzacharias/ccl's ci branch.
name: Quick check

on:
  workflow_dispatch:
    inputs:
      ccl_ref:
        description: "gzacharias/ccl branch, tag or commit to build"
        default: ci
  push:
    branches: [ci-quick]

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      platforms: '["intel", "arm64"]'

  gen2:
    needs: native
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/gen2.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}

  vm:
    needs: gen2
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/vm.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      hosts: '["sbcl", "ccl"]'
