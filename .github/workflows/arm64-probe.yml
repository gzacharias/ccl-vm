# Native-build probe on every platform GitHub offers: builds bc-compiler from the ccl 1.14
# binaries, makes the bc bundle and tests it (native-probe.yml) on Apple Silicon, x86-64 Linux
# and arm64 Linux (gzacharias/ccl#4, #7).  First runs the whole probe on an Intel mac, where
# everything is known to work, so that a broken workflow fails there instead of wasting scarce
# runs.  Only if that passes, runs the others, plus, as controls, upstream-base (the upstream ccl
# it's merged with, which has no bc compiler, so its probe stops after ccl-tests) on the two arm64
# platforms.  Then compares every bc bundle with the Intel one: they should be byte-identical.
# The overnight suite runs it with workflow_dispatch; a push to the ci-arm64 branch tests
# gzacharias/ccl's ci branch.
name: Apple Silicon probe

on:
  workflow_dispatch:
    inputs:
      ccl_ref:
        description: "gzacharias/ccl branch, tag or commit to build"
        default: bc-compiler
  push:
    branches: [ci-arm64]

permissions:
  contents: read

jobs:
  intel:
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: macos-15-intel
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      strict: true
      label: intel

  arm64:
    needs: intel
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: macos-latest
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      strict: false
      label: arm64

  linux-x86:
    needs: intel
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: ubuntu-latest
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      strict: false
      label: linux-x86

  linux-arm64:
    needs: intel
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: ubuntu-24.04-arm
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      strict: false
      label: linux-arm64

  arm64-upstream:
    needs: intel
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: macos-latest
      ccl_ref: upstream-base
      strict: false
      label: arm64-upstream

  linux-arm64-upstream:
    needs: intel
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: ubuntu-24.04-arm
      ccl_ref: upstream-base
      strict: false
      label: linux-arm64-upstream

  # The bundle is text and shouldn't depend on the machine that compiled it.
  compare:
    needs: [intel, arm64, linux-x86, linux-arm64]
    if: ${{ !cancelled() && needs.intel.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # One download per VM-rebuilt bundle, each into its own directory: with a pattern that happens
      # to match just one artifact, download-artifact unpacks it at the top level instead.  A bundle
      # that's missing (its step failed) is reported below.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vm-bundle-intel
          path: vm-bundle-intel
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vm-bundle-arm64
          path: vm-bundle-arm64
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: vm-bundle-ccl-arm64
          path: vm-bundle-ccl-arm64
      - uses: actions/download-artifact@v8
        with:
          pattern: ccl-bc-*
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - name: Every bundle must equal the Intel mac one
        run: |
          ci=ccl-vm/.github/ci
          status=0
          $ci/compare-bundles.sh "Intel mac=ccl-bc-intel/ccl-bc.tar.gz" \
            arm64=ccl-bc-arm64/ccl-bc.tar.gz linux-x86=ccl-bc-linux-x86/ccl-bc.tar.gz linux-arm64=ccl-bc-linux-arm64/ccl-bc.tar.gz || status=1
          # The bundle CCL rebuilds inside the VM shouldn't depend on the machine or host lisp the VM runs on either.
          $ci/compare-bundles.sh "VM-rebuilt on Intel (sbcl)=vm-bundle-intel/vm-bundle.tar.gz" \
            "VM-rebuilt on Apple Silicon (sbcl)=vm-bundle-arm64/vm-bundle.tar.gz" \
            "VM-rebuilt on Apple Silicon (ccl)=vm-bundle-ccl-arm64/vm-bundle-ccl.tar.gz" || status=1
          exit $status
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: bundle-diff
          path: bundle-diff.txt
