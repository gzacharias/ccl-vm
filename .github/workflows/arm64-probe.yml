# Native-build probe on every platform GitHub offers: builds bc-compiler from the ccl 1.14
# binaries, makes the bc bundle and tests it (native-probe.yml) on Apple Silicon, x86-64 Linux
# and arm64 Linux (gzacharias/ccl#4, #7).  First runs the whole probe on an Intel mac, where
# everything is known to work, so that a broken workflow fails there instead of wasting scarce
# runs.  Only if that passes, runs the others, plus, as controls, upstream-base (the upstream ccl
# it's merged with, which has no bc compiler, so its probe stops after ccl-tests) on the two arm64
# platforms.  Then compares every bc bundle with the Intel one: they should be byte-identical.
# The overnight suite runs it with workflow_dispatch; a push to the ci-arm64 branch tests
# gzacharias/ccl's ci branch.
name: Apple Silicon probe

on:
  workflow_dispatch:
    inputs:
      ccl_ref:
        description: "gzacharias/ccl branch, tag or commit to build"
        default: bc-compiler
  push:
    branches: [ci-arm64]

permissions:
  contents: read

jobs:
  intel:
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: macos-15-intel
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      strict: true
      label: intel

  arm64:
    needs: intel
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: macos-latest
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      strict: false
      label: arm64

  linux-x86:
    needs: intel
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: ubuntu-latest
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      strict: false
      label: linux-x86

  linux-arm64:
    needs: intel
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: ubuntu-24.04-arm
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      strict: false
      label: linux-arm64

  arm64-upstream:
    needs: intel
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: macos-latest
      ccl_ref: upstream-base
      strict: false
      label: arm64-upstream

  linux-arm64-upstream:
    needs: intel
    uses: ./.github/workflows/native-probe.yml
    with:
      runner: ubuntu-24.04-arm
      ccl_ref: upstream-base
      strict: false
      label: linux-arm64-upstream

  # The bundle is text and shouldn't depend on the machine that compiled it.
  compare:
    needs: [intel, arm64, linux-x86, linux-arm64]
    if: ${{ !cancelled() && needs.intel.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-bundle-*"
      - uses: actions/download-artifact@v8
        with:
          pattern: ccl-bc-*
      - name: Every bundle must equal the Intel mac one
        run: |
          mkdir intel
          tar -xzf ccl-bc-intel/ccl-bc.tar.gz -C intel
          echo "bc files: intel $(find intel -name '*.bc' | wc -l)"
          status=0
          : > bundle-diff.txt
          for label in arm64 linux-x86 linux-arm64; do
            if [ ! -f ccl-bc-$label/ccl-bc.tar.gz ]; then
              echo "::error::no $label bundle (its probe didn't get that far)"; status=1; continue
            fi
            mkdir $label
            tar -xzf ccl-bc-$label/ccl-bc.tar.gz -C $label
            if diff -r intel $label > diff-$label.txt; then
              echo "$label: byte-identical to the Intel bundle ($(find $label -name '*.bc' | wc -l) files)"
            else
              echo "::error::the $label bundle differs from the Intel one ($(grep -c '^diff\|^Only in' diff-$label.txt) files)"
              { echo "=== $label"; cat diff-$label.txt; } >> bundle-diff.txt
              status=1
            fi
          done
          # The bundle CCL rebuilds inside the VM shouldn't depend on the machine the VM runs on either.
          if [ -f vm-bundle-intel/vm-bundle.tar.gz ] && [ -f vm-bundle-arm64/vm-bundle.tar.gz ]; then
            mkdir vm-intel vm-arm64
            tar -xzf vm-bundle-intel/vm-bundle.tar.gz -C vm-intel
            tar -xzf vm-bundle-arm64/vm-bundle.tar.gz -C vm-arm64
            if diff -r vm-intel vm-arm64 > diff-vm.txt; then
              echo "VM-rebuilt bundles: Apple Silicon byte-identical to Intel ($(find vm-arm64 -name '*.bc' | wc -l) files)"
            else
              echo "::error::the bundle rebuilt in the VM on Apple Silicon differs from the Intel one ($(grep -c '^diff\|^Only in' diff-vm.txt) files)"
              { echo "=== VM-rebuilt, arm64 vs intel"; cat diff-vm.txt; } >> bundle-diff.txt
              status=1
            fi
          else
            echo "::error::missing a VM-rebuilt bundle (intel: $([ -f vm-bundle-intel/vm-bundle.tar.gz ] && echo yes || echo no), arm64: $([ -f vm-bundle-arm64/vm-bundle.tar.gz ] && echo yes || echo no))"
            status=1
          fi
          # Same for the bundle rebuilt in the VM hosted in ccl on Apple Silicon.
          if [ -f vm-bundle-intel/vm-bundle.tar.gz ] && [ -f vm-bundle-ccl-arm64/vm-bundle-ccl.tar.gz ]; then
            mkdir -p vm-intel vm-ccl-arm64
            [ -d vm-intel/vm-rebuild ] || tar -xzf vm-bundle-intel/vm-bundle.tar.gz -C vm-intel
            tar -xzf vm-bundle-ccl-arm64/vm-bundle-ccl.tar.gz -C vm-ccl-arm64
            if diff -r vm-intel/vm-rebuild vm-ccl-arm64/vm-rebuild-ccl > diff-vm-ccl.txt; then
              echo "VM-rebuilt bundles: ccl host on Apple Silicon byte-identical to Intel ($(find vm-ccl-arm64 -name '*.bc' | wc -l) files)"
            else
              echo "::error::the bundle rebuilt in the VM hosted in ccl on Apple Silicon differs from the Intel one ($(grep -c '^diff\|^Only in' diff-vm-ccl.txt) files)"
              { echo "=== VM-rebuilt, ccl host on arm64 vs intel"; cat diff-vm-ccl.txt; } >> bundle-diff.txt
              status=1
            fi
          else
            echo "::error::missing a VM-rebuilt bundle (intel: $([ -f vm-bundle-intel/vm-bundle.tar.gz ] && echo yes || echo no), ccl host on arm64: $([ -f vm-bundle-ccl-arm64/vm-bundle-ccl.tar.gz ] && echo yes || echo no))"
            status=1
          fi
          head -200 bundle-diff.txt
          exit $status
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: bundle-diff
          path: bundle-diff.txt
