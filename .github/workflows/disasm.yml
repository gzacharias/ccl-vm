# One-off: the arm64 subprim-disassembly patch (.github/subprim-disasm.patch) on Clozure/ccl
# master, on darwinarm64: build, then .github/subprim-test.lisp.  Push to ci-disasm to run.
name: arm64 subprim disassembly

on:
  push:
    branches: [ci-disasm]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ vars.ARM64_MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Clozure/ccl
          ref: master
          path: ccl
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - run: git -C ccl apply ../ccl-vm/.github/subprim-disasm.patch && git -C ccl diff --stat
      - run: ccl-vm/.github/ci/install-bootstrap.sh
      - run: ccl-vm/.github/ci/native-rebuild.sh 1
      - run: ccl-vm/.github/ci/native-rebuild.sh 2
      - name: Test
        run: |
          cd ccl && ./$CCL_KERNEL -n -b -l ../ccl-vm/.github/subprim-test.lisp < /dev/null > ../result.txt 2>&1 || true
          cat ../result.txt
      - uses: actions/upload-artifact@v7
        with:
          name: subprim
          path: result.txt
