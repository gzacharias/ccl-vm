# The full suite: native builds on every platform (native.yml), then the canonical bundle,
# generations 1 and 2 on sbcl on the Intel mac (gen2.yml), then, in parallel, every VM host on both
# macs on generation 2, with every host's generation 1 compared (vm.yml), and every cross-compile
# (cross.yml).
# Dispatch by hand, or push to the ci-nightly branch (tests gzacharias/ccl's ci branch).
name: Nightly

on:
  workflow_dispatch:
    inputs:
      ccl_ref:
        description: "gzacharias/ccl branch, tag or commit to build"
        default: ci
  push:
    branches: [ci-nightly]

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}

  # The VM needs only the native bundle, so a failure elsewhere (say, ccl-tests on Linux) doesn't
  # stop it.
  gen2:
    needs: native
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/gen2.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}

  vm:
    needs: gen2
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/vm.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      rebuild_hosts: '["sbcl", "ccl"]'

  cross:
    needs: [native, gen2]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/cross.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}
      ccl_tests_ref: ${{ needs.native.outputs.ccl_tests_ref }}
