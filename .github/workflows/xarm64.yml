# Cross-compiles a native darwinarm64 (Apple Silicon) ccl on an Intel mac, three times: with native
# ccl (the control) and in ccl-vm hosted in sbcl and in ccl, booted from the canonical bundle
# (generation 2, gen2.yml).  Then, on Apple Silicon, boots each boot image in the stock 1.14
# darwinarm64 kernel, saves a full image and runs ccl-tests on it (against upstream-base's
# results on Apple Silicon, ccl-tests-baseline.yml), and compares the native and VM (sbcl host)
# cross-compiles' fasls and boot images.
name: Cross-compile to darwinarm64

on:
  workflow_dispatch:
    inputs:
      ccl_ref:
        description: "gzacharias/ccl branch, tag or commit to build"
        default: ci
  # A new workflow can only be dispatched once it's on the default branch; a push works anywhere.
  push:
    branches: [ci-xarm64]

permissions:
  contents: read

jobs:
  bundle:
    uses: ./.github/workflows/bundle.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}

  gen2:
    needs: bundle
    uses: ./.github/workflows/gen2.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}

  baseline:
    uses: ./.github/workflows/ccl-tests-baseline.yml
    with:
      labels: '["arm64"]'

  native-xc:
    needs: bundle
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ccl-native
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - name: Unpack the native build
        run: tar -xzf ccl-native.tar.gz
      - name: Cross-compile with native ccl
        run: ccl-vm/.github/ci/cross-compile.sh native darwinarm64 ccl
      - name: Pack the cross-compiled tree
        run: tar -czf xtree.tar.gz --exclude .git --exclude '*.dx64fsl' --exclude ccl-bc ccl
      - uses: actions/upload-artifact@v7
        with:
          name: xtree-native
          path: xtree.tar.gz
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-native-xc
          path: "*.log"

  vm-xc:
    needs: gen2
    strategy:
      fail-fast: false
      matrix:
        host: [sbcl, ccl]
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - name: Check out the sources to cross-compile
        uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl
          ref: ${{ inputs.ccl_ref || 'ci' }}
          path: ccl
          fetch-depth: 0               # tags, for the version string
      - uses: actions/download-artifact@v8
        with:
          name: ccl-bc-gen2
      - name: Install ${{ matrix.host }} and Quicklisp
        run: ccl-vm/.github/ci/install-hosts.sh ${{ matrix.host }}
      - name: Cross-compile in the VM (${{ matrix.host }} host)
        run: ccl-vm/.github/ci/cross-compile.sh ${{ matrix.host }} darwinarm64 ccl
      - name: Pack the cross-compiled tree
        run: tar -czf xtree.tar.gz --exclude .git ccl
      - uses: actions/upload-artifact@v7
        with:
          name: xtree-vm-${{ matrix.host }}
          path: xtree.tar.gz
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-vm-xc-${{ matrix.host }}
          path: "*.log"

  boot:
    needs: [native-xc, vm-xc, baseline]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        source: [native, vm-sbcl, vm-ccl]
    runs-on: ${{ vars.ARM64_MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 90
    env:
      CCL_TESTS_REF: ${{ needs.baseline.outputs.ccl_tests_ref }}
    steps:
      - id: get
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: xtree-${{ matrix.source }}
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - uses: actions/download-artifact@v8
        with:
          name: ccl-tests-baseline-arm64
          path: ccl-tests-baseline
      - name: Boot the boot image in the stock 1.14 kernel and save a full image
        if: ${{ steps.get.outcome == 'success' }}
        run: |
          tar -xzf xtree.tar.gz
          ccl-vm/.github/ci/boot-xc.sh darwinarm64 ccl
      - name: Run ccl-tests on the cross-compiled image
        if: ${{ steps.get.outcome == 'success' }}
        timeout-minutes: 60
        run: ccl-vm/.github/ci/ccl-tests.sh ccl/darm64cl ccl-tests-baseline/ccl-tests-failures.txt
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-boot-${{ matrix.source }}
          path: |
            *.log
            ccl/boot.log

  # The native and VM (sbcl host) cross-compiles should produce the same fasls and boot image.
  compare:
    needs: [native-xc, vm-xc]
    if: ${{ !cancelled() && needs.native-xc.result == 'success' && needs.vm-xc.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: xtree-*
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - name: Compare the VM's cross-compile with the native one
        run: |
          for s in native vm-sbcl; do mkdir $s; tar -xzf xtree-$s/xtree.tar.gz -C $s; done
          ccl-vm/.github/ci/compare-xc.sh darwinarm64 native/ccl vm-sbcl/ccl
