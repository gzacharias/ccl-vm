# Reusable workflow, called by arm64-probe.yml: builds bc-compiler natively on one kind of
# machine (macOS or Linux, x86-64 or arm64), starting from the ccl 1.14 binaries for it, compiles
# the bc bundle, and tests the result as far as it gets: runs ccl-tests on the native build and,
# on macOS only (ccl-vm doesn't run on Linux yet, ccl-vm#14), boots the bundle in ccl-vm
# on sbcl (and on Apple Silicon also on ccl) and rebuilds ccl in the VM.  Each step that can still run after a failure does
# (and unless strict, the failure doesn't fail the job), so a single run collects as much as
# possible.  If the first rebuild fails, boots its boot image in the kernel debugger to see why.
# Uploads ccl-bc-<label> (the bundle), vm-bundle-<label> (the bundle rebuilt in the VM, macOS only;
# vm-bundle-ccl-<label> with the ccl host, Apple Silicon only)
# and logs-<label>; the job summary lists every step's
# outcome.  The steps' scripts are in .github/ci/.
name: Native build probe

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub runner label"
        type: string
        required: true
      ccl_ref:
        description: "gzacharias/ccl branch, tag or commit to build"
        type: string
        required: true
      strict:
        description: "Fail the job at the first failing step (for the known-good control run)"
        type: boolean
        required: true
      label:
        description: "Distinguishes this job's artifacts (ccl-bc-LABEL, logs-LABEL)"
        type: string
        required: true

jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    steps:
      - name: Check out bc-compiler
        uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl
          ref: ${{ inputs.ccl_ref }}
          path: ccl
          fetch-depth: 0               # full history and tags, so `git describe` works for the version string

      # The scripts come from this repository.
      - name: Check out ccl-vm
        uses: actions/checkout@v7
        with:
          path: ccl-vm

      - name: Install 1.14 bootstrapping binaries
        run: ccl-vm/.github/ci/install-bootstrap.sh

      - name: First rebuild (stock 1.14 kernel)
        id: build1
        continue-on-error: ${{ !inputs.strict }}
        run: ccl-vm/.github/ci/native-rebuild.sh 1

      - name: Boot the new boot image in the kernel debugger
        id: boot-debug
        if: ${{ !cancelled() && steps.build1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 5
        run: ccl-vm/.github/ci/boot-debug.sh

      # Warnings don't stop the probe from going on to make the bundle, unless strict.
      - name: Second rebuild (should be warning-free)
        id: build2
        if: ${{ !cancelled() && steps.build1.outcome == 'success' }}
        continue-on-error: ${{ !inputs.strict }}
        run: ccl-vm/.github/ci/native-rebuild.sh 2 ${{ inputs.strict && '--fail-on-warnings' || '' }}

      - name: Compile the bc bundle
        id: bundle
        if: ${{ !cancelled() && steps.build2.outcome == 'success' }}
        continue-on-error: ${{ !inputs.strict }}
        run: ccl-vm/.github/ci/bc-compile.sh

      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ccl-bc-${{ inputs.label }}
          path: ccl-bc.tar.gz

      # On Apple Silicon, ccl is a VM host too (on Intel, vm-test.yml covers the ccl host).
      - name: Install sbcl (and on Apple Silicon ccl) and Quicklisp
        id: hosts
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && runner.os == 'macOS' }}
        run: ccl-vm/.github/ci/install-hosts.sh sbcl ${{ runner.arch == 'ARM64' && 'ccl' || '' }}

      - name: Boot the bundle in the VM (sbcl host)
        id: smoke
        if: ${{ !cancelled() && steps.hosts.outcome == 'success' }}
        continue-on-error: ${{ !inputs.strict }}
        run: ccl-vm/.github/ci/vm-smoke.sh sbcl

      - name: Boot the bundle in the VM (ccl host)
        id: smoke-ccl
        if: ${{ !cancelled() && steps.hosts.outcome == 'success' && runner.arch == 'ARM64' }}
        continue-on-error: ${{ !inputs.strict }}
        run: ccl-vm/.github/ci/vm-smoke.sh ccl

      - name: Check out ccl-tests
        if: ${{ !cancelled() && steps.build2.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          repository: Clozure/ccl-tests
          path: ccl-tests

      - name: Run ccl-tests on the native build
        id: ccl-tests
        if: ${{ !cancelled() && steps.build2.outcome == 'success' }}
        # Test failures are results to report, not a broken workflow, so they never stop the
        # control run (ccl-tests can be ahead of the ccl being built).
        continue-on-error: true
        timeout-minutes: 60
        run: ccl-vm/.github/ci/ccl-tests.sh ccl/$CCL_KERNEL

      - name: rebuild-ccl inside the VM (sbcl host)
        id: vm-rebuild
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        continue-on-error: ${{ !inputs.strict }}
        timeout-minutes: 60
        run: ccl-vm/.github/ci/vm-rebuild.sh sbcl ccl-bc vm-rebuild

      - name: Pack the VM-rebuilt bundle
        if: ${{ !cancelled() && steps.vm-rebuild.outcome == 'success' }}
        run: tar -czf vm-bundle.tar.gz vm-rebuild

      - if: ${{ !cancelled() && steps.vm-rebuild.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: vm-bundle-${{ inputs.label }}
          path: vm-bundle.tar.gz

      - name: rebuild-ccl inside the VM (ccl host)
        id: vm-rebuild-ccl
        if: ${{ !cancelled() && steps.smoke-ccl.outcome == 'success' }}
        continue-on-error: ${{ !inputs.strict }}
        timeout-minutes: 120
        run: ccl-vm/.github/ci/vm-rebuild.sh ccl ccl-bc vm-rebuild-ccl

      - name: Pack the bundle rebuilt in the VM on ccl
        if: ${{ !cancelled() && steps.vm-rebuild-ccl.outcome == 'success' }}
        run: tar -czf vm-bundle-ccl.tar.gz vm-rebuild-ccl

      - if: ${{ !cancelled() && steps.vm-rebuild-ccl.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: vm-bundle-ccl-${{ inputs.label }}
          path: vm-bundle-ccl.tar.gz

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### ${{ inputs.label }}: ${{ inputs.ccl_ref }} on ${{ inputs.runner }} ($(uname -m))"
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| first rebuild | ${{ steps.build1.outcome }} |"
            echo "| boot image in kernel debugger | ${{ steps.boot-debug.outcome }} |"
            echo "| second rebuild | ${{ steps.build2.outcome }} |"
            echo "| bc bundle | ${{ steps.bundle.outcome }} |"
            echo "| boot bundle in VM | ${{ steps.smoke.outcome }} |"
            echo "| boot bundle in VM (ccl host) | ${{ steps.smoke-ccl.outcome }} |"
            echo "| ccl-tests | ${{ steps.ccl-tests.outcome }} |"
            echo "| rebuild-ccl in VM | ${{ steps.vm-rebuild.outcome }} |"
            echo "| rebuild-ccl in VM (ccl host) | ${{ steps.vm-rebuild-ccl.outcome }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ inputs.label }}
          path: "*.log"
