# VM hosts (matrix C): {sbcl, ccl 1.14} x {Intel, Apple Silicon mac}, all on the canonical bundle
# (artifact ccl-bc-gen2, from gen2.yml in the same run).  Each cell boots the bundle (smoke) and
# runs the regression tests (tests/regression).  The rebuild_hosts cells also rebuild ccl in the VM
# from the native bundle (artifact ccl-bc), making their own generation 1, and the compare job
# requires every one to be byte-identical to sbcl-intel's (artifact gen1-sbcl-intel, from
# gen2.yml, which sbcl-intel doesn't redo).  That is why only sbcl-intel's generation 2 is booted
# and tested: every host would have built the same one.  Without checks, the regression tests are
# skipped.  With release_tag, the bundle is that release's ccl-bc.tar.gz instead, the
# rebuild_hosts cells rebuild from it (sbcl-intel too), and there is no artifact from this run.
# Called by nightly.yml, quick.yml and released.yml.  The steps' scripts are in .github/ci/.
name: VM tests

on:
  workflow_call:
    inputs:
      ccl_ref:
        type: string
        required: true
      hosts:
        description: "JSON list of host lisps"
        type: string
        default: '["sbcl", "ccl"]'
      macs:
        description: "JSON list of macs (intel, arm64)"
        type: string
        default: '["intel", "arm64"]'
      rebuild_hosts:
        description: "JSON list of the host lisps that also rebuild ccl in the VM, for the cross-host comparison"
        type: string
        default: '[]'
      checks:
        description: "Run the regression tests (tests/regression)"
        type: boolean
        default: true
      release_tag:
        description: "Use this ccl-vm release's bundle instead of the ccl-bc artifact"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  vm:
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
        mac: ${{ fromJSON(inputs.macs) }}
    # (runs-on can't see env.)
    runs-on: ${{ fromJSON('{"intel":"macos-15-intel","arm64":"macos-latest"}')[matrix.mac] }}
    timeout-minutes: 330
    env:
      CELL: ${{ matrix.host }}-${{ matrix.mac }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - name: Check out the ccl sources (for rebuild-ccl)
        uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl
          ref: ${{ inputs.ccl_ref }}
          path: ccl
          fetch-depth: 0               # full history and tags, so `git describe` works for the version string
      - name: Get the canonical bundle
        if: ${{ inputs.release_tag == '' }}
        uses: actions/download-artifact@v8
        with:
          name: ccl-bc-gen2
      - name: Download the bundle of release ${{ inputs.release_tag }}
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.release_tag }}" -R "$GITHUB_REPOSITORY" -p ccl-bc.tar.gz
      - name: Install ${{ matrix.host }} and Quicklisp
        run: ccl-vm/.github/ci/install-hosts.sh ${{ matrix.host }}

      - name: Boot the bundle in the VM
        run: ccl-vm/.github/ci/vm-smoke.sh ${{ matrix.host }}
      - name: Regression tests
        if: ${{ !cancelled() && inputs.checks }}
        run: ccl-vm/tests/regression/run.sh ${{ matrix.host }} ccl-bc

      # From the native bundle, or with release_tag from the release's.  gen2.yml has made
      # sbcl-intel's from the native bundle.
      - name: Get the native bundle
        id: native
        if: ${{ !cancelled() && contains(fromJSON(inputs.rebuild_hosts), matrix.host) && inputs.release_tag == '' && env.CELL != 'sbcl-intel' }}
        uses: actions/download-artifact@v8
        with:
          name: ccl-bc
          path: native
      - name: Generation 1 (rebuild ccl in the VM)
        id: gen1
        if: ${{ !cancelled() && contains(fromJSON(inputs.rebuild_hosts), matrix.host) && (inputs.release_tag != '' || steps.native.outcome == 'success') }}
        timeout-minutes: 150
        run: |
          if [ -f native/ccl-bc.tar.gz ]; then
            tar -xzf native/ccl-bc.tar.gz -C native
            from=native/ccl-bc
          else
            from=ccl-bc
          fi
          ccl-vm/.github/ci/vm-rebuild.sh ${{ matrix.host }} $from gen1
      - name: Save generation 1
        if: ${{ !cancelled() && steps.gen1.outcome == 'success' }}
        run: tar -czf gen1.tar.gz gen1
      - if: ${{ !cancelled() && steps.gen1.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: gen1-${{ env.CELL }}
          path: gen1.tar.gz

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vm-logs-${{ env.CELL }}
          path: |
            *.log
            regression-*/

  # The bundle CCL rebuilds inside the VM mustn't depend on the host lisp or the machine.
  # Without release_tag, the reference is gen2.yml's generation 1 (sbcl-intel).
  compare:
    needs: vm
    if: ${{ !cancelled() && inputs.rebuild_hosts != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - uses: actions/download-artifact@v8
        with:
          pattern: gen1-*
      - name: Every generation 1 must equal sbcl-intel's
        env:
          HOSTS: ${{ inputs.hosts }}
          REBUILD_HOSTS: ${{ inputs.rebuild_hosts }}
          MACS: ${{ inputs.macs }}
        run: |
          others=()
          for h in $(echo "$HOSTS" | tr -d '[]",'); do
            [[ $REBUILD_HOSTS == *\"$h\"* ]] || continue
            for m in $(echo "$MACS" | tr -d '[]",'); do
              [ $h-$m = sbcl-intel ] || others+=("$h-$m=gen1-$h-$m/gen1.tar.gz")
            done
          done
          ccl-vm/.github/ci/compare-bundles.sh "sbcl-intel=gen1-sbcl-intel/gen1.tar.gz" "${others[@]}"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gen1-diff
          path: bundle-diff.txt
