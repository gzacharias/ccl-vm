# VM hosts (matrix C): {sbcl, ccl 1.14} x {Intel mac, Apple Silicon mac, x86-64 Linux, arm64 Linux}, all on the
# canonical bundle for the OS (artifact ccl-bc-gen2 on the macs, lccl-bc-gen2 on Linux, from
# gen2.yml in the same run).  Each cell boots the bundle (smoke) and runs the regression tests
# (tests/regression).  The rebuild_hosts cells also rebuild ccl in the VM from the native bundle
# (artifact ccl-bc, or lccl-bc on Linux), making their own generation 1, and the compare job
# requires every one to be byte-identical to the reference for its OS: sbcl-intel's on the macs,
# sbcl-linux-x86's on Linux (artifacts gen1-sbcl-intel and gen1-sbcl-linux-x86, from gen2.yml, which
# those cells don't redo).  That is why only the reference's generation 2 is booted and tested:
# every host would have built the same one.  Without checks, the regression tests are skipped.
# With release_tag, the bundle is that release's dccl-bc.tar.gz or lccl-bc.tar.gz instead, the
# rebuild_hosts cells rebuild from it (the references too), and there is no artifact from this run.
# Called by nightly.yml, quick.yml and released.yml.  The steps' scripts are in .github/ci/.
name: VM tests

on:
  workflow_call:
    inputs:
      ccl_ref:
        type: string
        required: true
      hosts:
        description: "JSON list of host lisps"
        type: string
        default: '["sbcl", "ccl"]'
      platforms:
        description: "JSON list of platforms (intel, arm64, linux-x86, linux-arm64)"
        type: string
        default: '["intel", "arm64", "linux-x86", "linux-arm64"]'
      rebuild_hosts:
        description: "JSON list of the host lisps that also rebuild ccl in the VM, for the cross-host comparison"
        type: string
        default: '[]'
      checks:
        description: "Run the regression tests (tests/regression)"
        type: boolean
        default: true
      release_tag:
        description: "Use this ccl-vm release's bundle instead of the ccl-bc-gen2 / lccl-bc-gen2 artifact"
        type: string
        default: ''

permissions:
  contents: read

env:
  COPYFILE_DISABLE: 1   # no AppleDouble ._ entries from macOS tar

jobs:
  vm:
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
        platform: ${{ fromJSON(inputs.platforms) }}
    # (runs-on can't see env.)
    runs-on: ${{ matrix.platform == 'arm64' && (vars.ARM64_MACOS_RUNNER || 'macos-latest') || fromJSON('{"intel":"macos-15-intel","linux-x86":"ubuntu-latest","linux-arm64":"ubuntu-24.04-arm"}')[matrix.platform] }}
    timeout-minutes: 330
    env:
      CELL: ${{ matrix.host }}-${{ matrix.platform }}
      # The bundle directory the steps use, and the reference cell for the OS.
      BUNDLE: ${{ startsWith(matrix.platform, 'linux') && 'lccl-bc' || 'ccl-bc' }}
      BUNDLE_TARBALL: ${{ startsWith(matrix.platform, 'linux') && 'lccl-bc.tar.gz' || 'ccl-bc.tar.gz' }}
      REFERENCE: ${{ startsWith(matrix.platform, 'linux') && 'sbcl-linux-x86' || 'sbcl-intel' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - name: Check out the ccl sources (for rebuild-ccl)
        uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl
          ref: ${{ inputs.ccl_ref }}
          path: ccl
          fetch-depth: 0               # full history and tags, so `git describe` works for the version string
      - name: Get the canonical bundle
        if: ${{ inputs.release_tag == '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUNDLE }}-gen2
      - name: Download the bundle of release ${{ inputs.release_tag }}
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # On the macs, dccl-bc.tar.gz unpacks into ./dccl-bc/; renamed to the ./ccl-bc/ the steps use.
        run: |
          if [ $BUNDLE = lccl-bc ]; then
            gh release download "${{ inputs.release_tag }}" -R "$GITHUB_REPOSITORY" -p lccl-bc.tar.gz
          else
            gh release download "${{ inputs.release_tag }}" -R "$GITHUB_REPOSITORY" -p dccl-bc.tar.gz
            tar -xzf dccl-bc.tar.gz && mv dccl-bc ccl-bc && tar -czf ccl-bc.tar.gz ccl-bc && rm -r ccl-bc dccl-bc.tar.gz
          fi
      - name: Install ${{ matrix.host }} and Quicklisp
        run: ccl-vm/.github/ci/install-hosts.sh ${{ matrix.host }}

      - name: Boot the bundle in the VM
        run: ccl-vm/.github/ci/vm-smoke.sh ${{ matrix.host }} $BUNDLE
      - name: Regression tests
        if: ${{ !cancelled() && inputs.checks }}
        run: ccl-vm/tests/regression/run.sh ${{ matrix.host }} $BUNDLE

      # From the native bundle, or with release_tag from the release's.  gen2.yml has made the
      # references' from the native bundle.
      - name: Get the native bundle
        id: native
        if: ${{ !cancelled() && contains(fromJSON(inputs.rebuild_hosts), matrix.host) && inputs.release_tag == '' && env.CELL != env.REFERENCE }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUNDLE }}
          path: native
      - name: Generation 1 (rebuild ccl in the VM)
        id: gen1
        if: ${{ !cancelled() && contains(fromJSON(inputs.rebuild_hosts), matrix.host) && (inputs.release_tag != '' || steps.native.outcome == 'success') }}
        timeout-minutes: 150
        run: |
          if [ -f native/$BUNDLE_TARBALL ]; then
            tar -xzf native/$BUNDLE_TARBALL -C native
            from=native/$BUNDLE
          else
            from=$BUNDLE
          fi
          ccl-vm/.github/ci/vm-rebuild.sh ${{ matrix.host }} $from gen1
      - name: Save generation 1
        if: ${{ !cancelled() && steps.gen1.outcome == 'success' }}
        run: tar -czf gen1.tar.gz gen1
      - if: ${{ !cancelled() && steps.gen1.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: gen1-${{ env.CELL }}
          path: gen1.tar.gz

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vm-logs-${{ env.CELL }}
          path: |
            *.log
            regression-*/

  # The bundle CCL rebuilds inside the VM mustn't depend on the host lisp or the machine.
  # Without release_tag, the references are gen2.yml's generation 1s (sbcl-intel, sbcl-linux-x86).
  compare:
    needs: vm
    if: ${{ !cancelled() && inputs.rebuild_hosts != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - uses: actions/download-artifact@v8
        with:
          pattern: gen1-*
      - name: Every generation 1 must equal its OS's reference (sbcl-intel, sbcl-linux-x86)
        env:
          HOSTS: ${{ inputs.hosts }}
          REBUILD_HOSTS: ${{ inputs.rebuild_hosts }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          macs=() linux=()
          for h in $(echo "$HOSTS" | tr -d '[]",'); do
            [[ $REBUILD_HOSTS == *\"$h\"* ]] || continue
            for p in $(echo "$PLATFORMS" | tr -d '[]",'); do
              case $h-$p in
                sbcl-intel|sbcl-linux-x86) ;;
                *-linux-*) linux+=("$h-$p=gen1-$h-$p/gen1.tar.gz") ;;
                *) macs+=("$h-$p=gen1-$h-$p/gen1.tar.gz") ;;
              esac
            done
          done
          status=0
          if [[ $PLATFORMS == *intel* || ${#macs[@]} -gt 0 ]]; then
            ccl-vm/.github/ci/compare-bundles.sh "sbcl-intel=gen1-sbcl-intel/gen1.tar.gz" "${macs[@]}" || status=1
          fi
          if [[ $PLATFORMS == *linux* ]]; then
            ccl-vm/.github/ci/compare-bundles.sh "sbcl-linux-x86=gen1-sbcl-linux-x86/gen1.tar.gz" "${linux[@]}" || status=1
          fi
          exit $status
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gen1-diff
          path: bundle-diff.txt
