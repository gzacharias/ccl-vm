# VM hosts (matrix C): {sbcl, ccl 1.14} x {Intel, Apple Silicon mac}, all on the canonical bundle
# (artifact ccl-bc, from native.yml in the same run).  Each cell boots the bundle (smoke), runs the
# regression tests (tests/regression), rebuilds ccl in the VM (generation 1) and runs the
# regression tests on generation 1;
# with fixed_point, also rebuilds from generation 1 (generation 2), which must equal it.  The
# compare job then requires every cell's generation 1 to be byte-identical.  (Generation 1 is
# not the native bundle: they differ in every file, ccl-vm#13.)  Only the rebuild_hosts cells
# rebuild; without checks, the regression tests are skipped.  With release_tag,
# the bundle is that release's ccl-bc.tar.gz instead of the artifact.  Called by nightly.yml,
# quick.yml and released.yml.  The steps' scripts are in .github/ci/.
name: VM tests

on:
  workflow_call:
    inputs:
      ccl_ref:
        type: string
        required: true
      hosts:
        description: "JSON list of host lisps"
        type: string
        default: '["sbcl", "ccl"]'
      macs:
        description: "JSON list of macs (intel, arm64)"
        type: string
        default: '["intel", "arm64"]'
      rebuild_hosts:
        description: "JSON list of the host lisps that also rebuild ccl in the VM"
        type: string
        default: '["sbcl", "ccl"]'
      checks:
        description: "Run the regression tests (tests/regression)"
        type: boolean
        default: true
      release_tag:
        description: "Use this ccl-vm release's bundle instead of the ccl-bc artifact"
        type: string
        default: ''
      fixed_point:
        description: "Also build generation 2 and require it to equal generation 1"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  vm:
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
        mac: ${{ fromJSON(inputs.macs) }}
    # (runs-on can't see env.)
    runs-on: ${{ fromJSON('{"intel":"macos-15-intel","arm64":"macos-latest"}')[matrix.mac] }}
    timeout-minutes: 330
    env:
      CELL: ${{ matrix.host }}-${{ matrix.mac }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - name: Check out the ccl sources (for rebuild-ccl)
        uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl
          ref: ${{ inputs.ccl_ref }}
          path: ccl
          fetch-depth: 0               # full history and tags, so `git describe` works for the version string
      - if: ${{ inputs.release_tag == '' }}
        uses: actions/download-artifact@v8
        with:
          name: ccl-bc
      - name: Download the bundle of release ${{ inputs.release_tag }}
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" -R "$GITHUB_REPOSITORY" -p ccl-bc.tar.gz
          tar -xzf ccl-bc.tar.gz
      - name: Install ${{ matrix.host }} and Quicklisp
        run: ccl-vm/.github/ci/install-hosts.sh ${{ matrix.host }}

      - name: Boot the bundle in the VM
        run: ccl-vm/.github/ci/vm-smoke.sh ${{ matrix.host }}
      - name: Regression tests
        if: ${{ !cancelled() && inputs.checks }}
        run: ccl-vm/tests/regression/run.sh ${{ matrix.host }} ccl-bc

      - name: Generation 1 (rebuild ccl in the VM from the bundle)
        id: gen1
        if: ${{ !cancelled() && contains(fromJSON(inputs.rebuild_hosts), matrix.host) }}
        timeout-minutes: 150
        run: ccl-vm/.github/ci/vm-rebuild.sh ${{ matrix.host }} ccl-bc gen1
      - name: Regression tests on generation 1
        if: ${{ !cancelled() && inputs.checks && steps.gen1.outcome == 'success' }}
        run: ccl-vm/tests/regression/run.sh ${{ matrix.host }} gen1
      - name: Save generation 1
        if: ${{ !cancelled() && steps.gen1.outcome == 'success' }}
        run: tar -czf gen1.tar.gz gen1
      - if: ${{ !cancelled() && steps.gen1.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: gen1-${{ env.CELL }}
          path: gen1.tar.gz

      - name: Generation 2 (rebuild ccl in the VM from generation 1)
        id: gen2
        if: ${{ !cancelled() && inputs.fixed_point && steps.gen1.outcome == 'success' }}
        timeout-minutes: 150
        run: ccl-vm/.github/ci/vm-rebuild.sh ${{ matrix.host }} gen1 gen2
      - name: Generation 2 must equal generation 1
        if: ${{ !cancelled() && steps.gen2.outcome == 'success' }}
        run: ccl-vm/.github/ci/compare-bundles.sh "generation 1=gen1" "generation 2=gen2"

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vm-logs-${{ env.CELL }}
          path: |
            *.log
            regression-*/

  # The bundle CCL rebuilds inside the VM mustn't depend on the host lisp or the machine.
  compare:
    needs: vm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - uses: actions/download-artifact@v8
        with:
          pattern: gen1-*
      - name: Every generation 1 must equal sbcl-intel's
        env:
          HOSTS: ${{ inputs.hosts }}
          REBUILD_HOSTS: ${{ inputs.rebuild_hosts }}
          MACS: ${{ inputs.macs }}
        run: |
          cells=()
          for h in $(echo "$HOSTS" | tr -d '[]",'); do
            [[ $REBUILD_HOSTS == *\"$h\"* ]] || continue
            for m in $(echo "$MACS" | tr -d '[]",'); do cells+=("$h-$m"); done
          done
          ref=${cells[0]} others=()
          for c in "${cells[@]:1}"; do others+=("$c=gen1-$c/gen1.tar.gz"); done
          ccl-vm/.github/ci/compare-bundles.sh "$ref=gen1-$ref/gen1.tar.gz" "${others[@]}"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gen1-diff
          path: bundle-diff.txt
