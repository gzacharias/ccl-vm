# The long tests (about an hour or more), to run by hand or overnight.  Builds the native bc bundle
# (bundle.yml) and the canonical bundle, generations 1 and 2 on sbcl (gen2.yml, which requires
# them to be byte-identical), then in parallel, each on its own machine:
#   ccl-host-rebuild: rebuilds ccl in the VM from the native bundle with ccl 1.14 as the host; the
#                     result must be byte-identical to sbcl's generation 1 (compared by the
#                     cross-host job).
#   ccl-host-cross-compile: cross-compiles a native darwinx8664 ccl from the VM on ccl 1.14,
#                     booted from generation 2, and boots it.
# A push to the ci-extended branch tests gzacharias/ccl's ci branch.
# (Run workflow only shows up once this file is on the default branch.)
# The steps' scripts are in .github/ci/.
name: Extended VM tests

on:
  workflow_dispatch:
    inputs:
      ccl_ref:
        description: "gzacharias/ccl branch, tag or commit to build"
        default: bc-compiler
  push:
    branches: [ci-extended]

permissions:
  contents: read

env:
  CCL_REF: ${{ inputs.ccl_ref || 'ci' }}

jobs:
  bundle:
    uses: ./.github/workflows/bundle.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}

  gen2:
    needs: bundle
    uses: ./.github/workflows/gen2.yml
    with:
      ccl_ref: ${{ inputs.ccl_ref || 'ci' }}

  ccl-host-rebuild:
    needs: bundle
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl
          ref: ${{ env.CCL_REF }}
          path: ccl
          fetch-depth: 0               # as in gen2.yml: `git describe` makes the version string
      - uses: actions/download-artifact@v8
        with:
          name: ccl-bc
      - name: Install ccl 1.14 and Quicklisp
        run: ccl-vm/.github/ci/install-hosts.sh ccl

      - name: Rebuild ccl in the VM (ccl host)
        run: ccl-vm/.github/ci/vm-rebuild.sh ccl ccl-bc vm-bundle-ccl

      - name: Save the result, for the cross-host comparison
        run: tar -czf vm-bundle-ccl.tar.gz vm-bundle-ccl
      - uses: actions/upload-artifact@v7
        with:
          name: gen1-ccl-intel
          path: vm-bundle-ccl.tar.gz

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ccl-host-rebuild-logs
          path: "*.log"

  # The VM should compile the same .bc files whichever lisp it runs on.
  cross-host:
    needs: [gen2, ccl-host-rebuild]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - uses: actions/download-artifact@v8
        with:
          pattern: gen1-*
      - name: The ccl host's bundle must equal the sbcl host's
        run: ccl-vm/.github/ci/compare-bundles.sh "sbcl host=gen1-sbcl-intel/gen1.tar.gz" "ccl host=gen1-ccl-intel/vm-bundle-ccl.tar.gz"

  ccl-host-cross-compile:
    needs: gen2
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          path: ccl-vm
      - uses: actions/checkout@v7
        with:
          repository: gzacharias/ccl
          ref: ${{ env.CCL_REF }}
          path: ccl
          fetch-depth: 0               # full history and tags, so `git describe` works for the version string
      - uses: actions/download-artifact@v8
        with:
          name: ccl-bc-gen2
      - name: Install ccl 1.14 and Quicklisp
        run: ccl-vm/.github/ci/install-hosts.sh ccl

      - name: Cross-compile darwinx8664 from the VM (ccl host)
        run: ccl-vm/.github/ci/vm-cross-compile.sh ccl

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ccl-host-cross-compile-logs
          path: "*.log"
